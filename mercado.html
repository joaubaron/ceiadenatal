width: 100%;
padding: 2rem 3rem;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
border-top: 6px solid var(--vermelho);
}

/* Voltar: mesmo estilo do botão Fechar */
.link-voltar {
display: inline-block;
padding: 0.3rem 0.5rem 0.3rem 0;
font-family: 'Playfair Display', Georgia, serif;
font-size: 0.85rem;
font-weight: 600;
letter-spacing: 0.5px;
color: var(--verde-natal);
text-decoration: none;
text-align: left;
}

.link-voltar,
.link-voltar:focus,
.link-voltar:active {
outline: none;
-webkit-tap-highlight-color: transparent;
}

h1 {
font-family: 'Playfair Display', Georgia, serif;
font-size: 2.2rem;
font-weight: 600;
letter-spacing: 3px;
text-transform: uppercase;
text-align: center;
margin: 1.5rem 0 0.4rem;
}

.sub {
font-family: 'Great Vibes', 'Brush Script MT', cursive;
font-size: 2.4rem;
margin-top: 1.5rem;
color: var(--vermelho);
text-align: center;
line-height: 1;
}

.pessoas {
font-size: 0.8rem;
color: var(--prata-escuro);
text-align: center;
margin-top: 0;
}

/* Título de cada grupo */
.grupo-titulo {
display: flex;
align-items: center;
justify-content: center;
flex-wrap: wrap;
margin: 3rem 0 1.8rem;
}

.grupo-titulo::before,
.grupo-titulo::after {
content: '';
flex: 1;
height: 1px;
background-color: var(--dourado);
opacity: 0.6;
}

.grupo-titulo h2 {
font-family: 'Great Vibes', 'Brush Script MT', cursive;
font-size: 2.2rem;
font-weight: 400;
color: var(--vermelho);
padding: 0 1.5rem;
text-align: center;
flex: 0 0 100%;
order: -1;
}

.grupo-titulo .preco-titulo {
flex: 0 0 100%;
font-family: 'Montserrat', Arial, sans-serif;
font-size: 0.72rem;
color: var(--texto-claro);
text-align: center;
margin-top: -0.3rem;
}

/* Lista */
ul {
list-style: none;
}

li {
display: flex;
align-items: baseline;
gap: 0.6rem;
padding: 0.4rem 0;
font-size: 0.88rem;
line-height: 1.35;
}

li .nome {
font-family: 'Playfair Display', Georgia, serif;
font-weight: 600;
}

li .pontos {
flex: 1;
border-bottom: 1px dotted var(--dourado);
transform: translateY(-0.25rem);
min-width: 1rem;
}

li .preco {
white-space: nowrap;
font-weight: 600;
}

li.bebida {
color: var(--prata-escuro);
font-size: 0.8rem;
}

li.bebida .nome {
font-family: 'Montserrat', Arial, sans-serif;
font-weight: 400;
}

.total {
display: flex;
justify-content: space-between;
align-items: baseline;
margin-top: 1rem;
padding-top: 0.9rem;
border-top: 1px solid var(--dourado);
font-family: 'Playfair Display', Georgia, serif;
font-size: 1rem;
font-weight: 600;
}

footer {
margin-top: 4rem;
padding-top: 2rem;
border-top: 1px solid var(--prata);
text-align: center;
}

.footer-text {
font-family: 'Playfair Display', Georgia, serif;
font-style: italic;
font-size: 0.9rem;
}

@media (max-width: 768px) {
.menu-container { padding: 1.5rem; }
h1 { font-size: 1.8rem; }
.grupo-titulo h2 { font-size: 1.9rem; padding: 0 1rem; }
li { font-size: 0.88rem; }
}

/* Lista de compras */
.progresso {
font-size: 0.8rem;
color: var(--prata-escuro);
text-align: center;
margin-top: 0.4rem;
}

.btn-limpar {
margin: 0;
background: none;
border: none;
padding: 0.3rem 0.5rem;
font-family: 'Playfair Display', Georgia, serif;
font-size: 0.85rem;
font-weight: 600;
letter-spacing: 0.5px;
color: var(--verde-natal);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
}

.btn-limpar:focus { outline: none; }

li.item-lista { padding: 0; }

.item-lista label {
display: flex;
align-items: baseline;
gap: 0.6rem;
width: 100%;
padding: 0.55rem 0;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
}

.item-lista input {
-webkit-appearance: none;
appearance: none;
flex: none;
width: 18px;
height: 18px;
margin: 0;
position: relative;
top: 3px;
border: 1.5px solid var(--dourado);
background: #fff;
cursor: pointer;
}

.item-lista input:checked {
background: var(--verde-natal);
border-color: var(--verde-natal);
}

.item-lista input:checked::after {
content: '✓';
position: absolute;
inset: 0;
color: #fff;
font-size: 13px;
line-height: 16px;
text-align: center;
}

.item-lista input:focus-visible {
outline: 2px solid var(--dourado);
outline-offset: 2px;
}

.item-lista .texto { display: flex; flex-direction: column; }

.item-lista .usado {
font-family: 'Montserrat', Arial, sans-serif;
font-size: 0.72rem;
color: var(--texto-claro);
}

.item-lista .qtd {
font-weight: 600;
text-align: right;
max-width: 50%;
}

.item-lista.feito .texto,
.item-lista.feito .qtd {
text-decoration: line-through;
opacity: 0.45;
}

.modos {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 0.2rem 0.7rem;
margin-top: 0.8rem;
}

.btn-modo {
background: none;
border: none;
padding: 0.3rem 0.2rem;
white-space: nowrap;
font-family: 'Playfair Display', Georgia, serif;
font-size: 0.78rem;
font-weight: 600;
letter-spacing: 0.5px;
color: var(--prata-escuro);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
}

.btn-modo:focus { outline: none; }

.btn-modo.btn-limpar { color: var(--verde-natal); }

.btn-modo.ativo {
color: var(--verde-natal);
text-decoration: underline;
text-decoration-color: var(--dourado);
text-underline-offset: 5px;
}
</style>
</head>
<body>

<div class="menu-container">

<a class="link-voltar" href="index.html">Voltar ao cardápio</a>

<p class="sub">Ceia de Natal</p>
<p class="pessoas">Jantar para 5 pessoas</p>
<div class="modos">
<button type="button" class="btn-modo" data-modo="receita">🍳 Receita</button>
<button type="button" class="btn-modo" data-modo="corredor">🛒 Corredor</button>
<button type="button" class="btn-modo btn-limpar" id="limpar">♻️ Desmarcar</button>
</div>

<div id="lista"></div>

<footer>
<p class="footer-text">"O melhor tempero do Natal é a presença de todos."</p>
</footer>

</div>

<script src="receitas.js"></script>
<script>
(function () {
var CHAVE = 'ceia-mercado-v1';
var CHAVE_MODO = 'ceia-mercado-modo';
var ORDEM = ['Carnes e peixes', 'Frios e laticínios', 'Hortifrúti', 'Mercearia', 'Bebidas'];
var marcados = {};
var modo = 'corredor';

try { marcados = JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { marcados = {}; }
try { modo = localStorage.getItem(CHAVE_MODO) === 'receita' ? 'receita' : 'corredor'; } catch (e) {}

function salvar() {
try { localStorage.setItem(CHAVE, JSON.stringify(marcados)); } catch (e) {}
}

function el(tag, classe, texto) {
var x = document.createElement(tag);
if (classe) x.className = classe;
if (texto) x.textContent = texto;
return x;
}

var grupos = juntarItens();
var caixa = document.getElementById('lista');


// Uma linha da lista
function criarItem(nome, qtd, sub) {
var li = el('li', 'item-lista');
li.setAttribute('data-nome', nome);
var label = el('label');
var caixinha = document.createElement('input');
caixinha.type = 'checkbox';
caixinha.checked = !!marcados[nome];
li.classList.toggle('feito', caixinha.checked);

var texto = el('span', 'texto');
texto.appendChild(el('span', 'nome', nome));
if (sub) texto.appendChild(el('small', 'usado', sub));

label.appendChild(caixinha);
label.appendChild(texto);
label.appendChild(el('span', 'pontos'));
if (qtd) label.appendChild(el('span', 'qtd', qtd));
li.appendChild(label);

caixinha.addEventListener('change', function () {
if (caixinha.checked) marcados[nome] = true; else delete marcados[nome];
// o mesmo item pode aparecer em mais de uma receita: marca todos
caixa.querySelectorAll('.item-lista').forEach(function (outro) {
if (outro.getAttribute('data-nome') !== nome) return;
outro.querySelector('input').checked = caixinha.checked;
outro.classList.toggle('feito', caixinha.checked);
});
salvar();
});
return li;
}

function criarTitulo(texto, preco) {
var t = el('div', 'grupo-titulo');
t.appendChild(el('h2', '', texto));
if (preco) t.appendChild(el('div', 'preco-titulo', preco));
return t;
}

function desenharPorCorredor() {
ORDEM.forEach(function (cat) {
if (!grupos[cat]) return;
caixa.appendChild(criarTitulo(cat));
var ul = el('ul');
grupos[cat].forEach(function (item) {
ul.appendChild(criarItem(item.nome, item.qtd, item.usado));
});
caixa.appendChild(ul);
});
}

function desenharPorReceita() {
Object.keys(RECEITAS).forEach(function (id) {
var r = RECEITAS[id];
caixa.appendChild(criarTitulo(r.nome, r.preco));
var ul = el('ul');
r.itens.forEach(function (i) {
ul.appendChild(criarItem(i.n, formatarQtd(i.q, i.u), i.obs || ''));
});
caixa.appendChild(ul);
});
caixa.appendChild(criarTitulo('Bebidas'));
var ub = el('ul');
BEBIDAS.forEach(function (b) {
ub.appendChild(criarItem(b.n, '', b.obs));
});
caixa.appendChild(ub);
}

function desenhar() {
caixa.innerHTML = '';
if (modo === 'receita') desenharPorReceita(); else desenharPorCorredor();
document.querySelectorAll('.btn-modo[data-modo]').forEach(function (b) {
b.classList.toggle('ativo', b.getAttribute('data-modo') === modo);
});
}

document.querySelectorAll('.btn-modo[data-modo]').forEach(function (b) {
b.addEventListener('click', function () {
modo = b.getAttribute('data-modo');
try { localStorage.setItem(CHAVE_MODO, modo); } catch (e) {}
desenhar();
window.scrollTo(0, 0);
});
});

document.getElementById('limpar').addEventListener('click', function () {
marcados = {};
salvar();
desenhar();
});

desenhar();
})();
</script>

</body>
</html>
